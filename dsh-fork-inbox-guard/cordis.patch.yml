# dsh-fork-inbox-guard 的 web bundle 补丁。
# 声明本插件的挂载行，随 dsh.profile.bundles 自动挂载到 web profile：
# 宿主半部（index.ts，Node 22+ Type Stripping 直接加载）监听 agent/created，
# 丢弃分叉子会话继承来的、仍处于 pending 的输入。
#
# 不声明 `inject`：本插件不消费任何宿主服务（注册表经 ctx.get('agents') 可选读取，
# 不可用时保守跳过），因此挂载行无需服务依赖。
- insert:
    - id: dsh-fork-inbox-guard
      name: dsh-fork-inbox-guard
