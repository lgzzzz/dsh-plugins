# dsh-change-summary 的 web bundle 补丁。
# 声明本插件的挂载行,通过 dsh.profile.bundles 自动挂载到 web profile:
# 宿主半部按 <name>/package.json 解析（lib/index.js，挂
# /dsh-change-summary/diff 与 /dsh-change-summary/exists 路由,提供暂存区 vs
# 工作区 diff 与存在性过滤,需要 webServer + sessions 两个服务；
# 不在用户消息时自动 git add —— 暂存区内容即基线,由提交/手动暂存决定）；
# 客户端半部由包内 dsh.client.platform=web + immediately 注册进浏览器 roster。
- insert:
    - id: dsh-change-summary
      name: dsh-change-summary
      inject: [webServer, sessions]
