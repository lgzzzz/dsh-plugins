# dsh-left-dock 的 web bundle 补丁。
#
# 1) 停用内置左栏（ui-sidebar）：本插件要在**同一列**里放「活动栏 + 两个互斥面板」，
#    而 `sidebar` 是 single 槽位、子座位（sidebar.workspaces 等）只能有一个声明者，
#    两者同时在场会撞上「slot 已被声明」的装配校验。停用后由本插件注册该槽位的
#    占位组件，并原样声明同样的 6 个子座位（ui-workspace / ui-settings-general /
#    ui-brand-official / ui-cordis 的注册项因此继续生效，无需改动它们）。
#    `sidebar` 槽位本身由 ui-layout 声明，不受影响。
#
# 2) 挂载本插件：宿主半部为空宿主（index.ts），浏览器半部按包内
#    dsh.client.platform=web + immediately 注册进浏览器 roster，并由
#    package.json 的 dsh.client.external=["react"] 从模块表取 react。
- id: ui-sidebar
  disabled: true

- insert:
    - id: dsh-left-dock
      name: dsh-left-dock
