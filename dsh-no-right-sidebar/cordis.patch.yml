# dsh-no-right-sidebar 的 web bundle 补丁。
# 通过 dsh.profile.bundles 自动挂载到 web profile:
# - 停用右侧边栏的全部三行(dsh-web-app 组合中的浏览器 roster 行):
#   ui-sidebar-right(面板/展开按钮/guide 页与 sidebarRight 服务)、
#   ui-sidebar-textpreview(文本预览页)、ui-sidebar-files(工作区文件树页);
# - 挂载本插件行:浏览器半部提供 no-op 的 sidebarRight 桩服务。
#   桩必不可少——ui-chat 的浏览器半部 inject 声明了 "sidebarRight",cordis 对
#   inject 未满足的插件保持 INACTIVE(永不 apply);若只停用 ui-sidebar-right
#   而不提供桩,主聊天界面会整体瘫痪。
- id: ui-sidebar-right
  disabled: true

- id: ui-sidebar-textpreview
  disabled: true

- id: ui-sidebar-files
  disabled: true

- insert:
    - id: dsh-no-right-sidebar
      name: dsh-no-right-sidebar
