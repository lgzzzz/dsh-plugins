# dsh-session-auto-resume 的挂载行：随 dsh.profile.bundles 自动挂载到 web profile。
# 包名 / patch id / patch name / 导出 name 都是同一个字符串，见 docs/plugin-naming.md。
#
# config 里只放推荐的保守口径；要覆盖就改用户自己的 cordis.patch.yml，
# 匹配到同一 id 时整份 config 会被替换（记得把要保留的字段一起写上）。
- insert:
    - id: dsh-session-auto-resume
      name: dsh-session-auto-resume
      config:
        # 只处理最近 7 天内有活动的会话；0 表示不限。
        windowDays: 7
        # 每次启动最多恢复 10 个，避免一次唤醒太多会话。
        maxResumes: 10
        # 必须先核对会动哪些会话时改成 true：只记日志，不恢复。
        dryRun: false
