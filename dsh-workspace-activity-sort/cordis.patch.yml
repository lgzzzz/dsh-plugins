# dsh-workspace-activity-sort 的挂载行：随 dsh.profile.bundles 自动挂载。
# 宿主半部 index.ts（Node Type Stripping 直载）：盯住 api-session/activity、新建会话的归属、
# 回合终态（任务完成 / 模型请求重试耗尽），以及两条等待用户的 waterfall
# （approval/request、user-questions/request），用 workspace 注册表自己的 insertBefore 把最近
# 活跃的工作区提到持久显示顺序的最前；
# 浏览器半部 src/client.ts（tsdown 打成 lib/client.js）：跟随 workspace 控制器的顺序增量，
# 某个工作区被排到第一位时把侧栏的工作区列表滚回最上面。改客户端半部后先 `pnpm build`，
# 再让 dsh 重新合成启动图。
# 包名 / patch id / patch name / 导出 name / 服务名五者的分工见 docs/plugin-naming.md。
- insert:
    - id: dsh-workspace-activity-sort
      name: dsh-workspace-activity-sort
