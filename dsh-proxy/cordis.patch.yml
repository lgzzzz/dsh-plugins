- insert:
    - id: proxy
      name: dsh-proxy
      config:
        # Absolute path or bare name of the Xray-core binary; empty = look up
        # `xray` on PATH. Nothing is downloaded automatically.
        coreBinary: ''
        socksPort: 10808
        httpPort: 10809
        # Extra domain list data (`geosite.dat` / `geoip.dat`) for `ext:` values.
        geoDir: ''
        # Tool exposure: 'skill' gives the four rule-changing tools only after the
        # `proxy-routing` skill loads; 'always' exposes all eight from the start.
        toolExposure: skill
