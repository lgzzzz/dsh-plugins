- insert:
    - id: proxy
      name: dsh-proxy
      config:
        # Absolute path or bare name of the Xray-core binary; empty = look up
        # `xray` on PATH. Nothing is downloaded automatically.
        coreBinary: ''
        socksPort: 10808
        httpPort: 10809
        # Extra domain list data (`geosite.dat` / `geoip.dat`) for `ext:` values.
        geoDir: ''
        # Tool exposure: 'skill' gives the four rule-changing tools only after the
        # `proxy-routing` skill loads; 'always' exposes all nine from the start.
        toolExposure: skill
        # Access log: one line per connection with its actual exit, shown in the
        # Connections tab and readable through `proxy_traffic_read`. Writes
        # `<dataDir>/access.log`; set false to record nothing.
        accessLog: true
        # Start the kernel right after the plugin loads, once a node is selected.
        # Failures are logged only; the panel's start button stays available.
        autoStart: true
