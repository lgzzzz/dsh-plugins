# dsh-agent-auto-retry 的挂载行：随 dsh.profile.bundles 自动挂载。
# 只有宿主半部 index.ts（Node Type Stripping 直载，无构建产物）：它监听 agent loop 的
# `agent/request-error` waterfall，在下游恢复策略（提供方 retryPolicy、overflow compaction、
# 图片卸载）都放弃之后接手，按本插件策略重试失败的模型请求，并把每次重试写成与上游同形的
# llm/retry / llm/retry-started 事件。没有客户端代码，无需重建 Web 资源。
#
# 默认配置（全部可省，也可以在 profile 的 cordis.patch.yml 里按 id 覆盖）：
#   maxRetries: 5          同一 step 内最多追加几次重试；0 关闭
#   retryableCodes: ['*']  允许重试的失败码；'*' 匹配所有非永久性失败
#   permanentCodes: [...]  永不重试的失败码（认证 / 配额 / 请求格式 / 上下文超限…）
#   initialDelayMs: 2000   本地退避首个基准等待
#   maxDelayMs: 60000      本地退避单次上限
#   jitterRatio: 0.2       对称抖动幅度
#   maxRetryAfterMs: 300000 愿意服从的提供方 Retry-After 上限
#
# 包名 / patch id / patch name / 导出 name 五者的分工见 docs/plugin-naming.md。
- insert:
    - id: dsh-agent-auto-retry
      name: dsh-agent-auto-retry
