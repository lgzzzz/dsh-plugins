# dsh-active-session-limit 的 web bundle 挂载行：随 dsh.profile.bundles 自动挂载。
# 只有宿主半部 index.ts（Node Type Stripping 直载，挂钩 agent/* 生命周期事件），没有客户端半部。
# 包名 / patch id / patch name / 导出 name / 服务名五者的分工见 docs/plugin-naming.md。
- insert:
    - id: dsh-active-session-limit
      name: dsh-active-session-limit
      config:
        # 同时活跃的会话上限（含子智能体）。
        maxActive: 3
        # 上一个会话结束后，新会话要再等的毫秒数。
        cooldownMs: 5000
