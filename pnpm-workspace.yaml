packages:
  - 'dsh-*'
  - 'example/*'

# 依赖全部提升到仓库根 node_modules（插件目录自身不落 node_modules），
# 与各插件 scripts 里 `tsc` / `@esbuild/<platform>-<arch>` 的自解析路径一致。
nodeLinker: hoisted

# 仓库内本地 store（.gitignore 已忽略），清理 node_modules 后可离线重装。
storeDir: .pnpm-store

# esbuild 需要执行安装脚本（落 @esbuild/<platform>-<arch> 平台二进制）。
allowBuilds:
  esbuild: true

# pnpm 11 默认只接受发布满 24h 的版本；dsh 预发布包正是本机正在跟的版本，需放行。
#（此列表由 pnpm 在安装时自行维护。）
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.1.7-rc.2'
  - '@deepseek-ai/dsh-brand@0.1.7-rc.2'
  - '@deepseek-ai/dsh-invariants@0.1.7-rc.2'
